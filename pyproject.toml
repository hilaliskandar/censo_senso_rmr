[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censo-rmr"
version = "0.0.1"
description = "Pipeline reprodutivel para Censo 2022 e analise territorial da RMR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "geopandas>=1.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "libpysal>=4.12",
  "esda>=2.6",
  "statsmodels>=0.14",
  "requests>=2.28",
  "openpyxl>=3.1",
  "odfpy>=1.4"
]

[project.scripts]
censo-rmr = "censo_rmr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
