# Mapeamento operacional entre variaveis publicadas pelo IBGE e campos canonicos do pipeline.
# Fonte de autoridade: dicionarios oficiais listados em config/fontes.yaml.
# O campo status distingue mapeamentos confirmados daqueles ainda dependentes de conferencia direta do dicionario binario.

sexo_cor_alfabetizacao:
  populacao:
    POP_TOTAL:
      fonte: demografia
      expressao: [V01006]
      descricao: "Quantidade de moradores"
      status: confirmado
    POP_FEMININO:
      fonte: demografia
      expressao: [V01008]
      descricao: "Sexo feminino"
      status: confirmado

  cor_ou_raca:
    POP_BRANCA:
      fonte: cor_ou_raca
      expressao: [V01317]
      descricao: "Cor ou raca e branca"
      status: confirmado
    POP_PRETA:
      fonte: cor_ou_raca
      expressao: [V01318]
      descricao: "Cor ou raca e preta"
      status: confirmado
    POP_AMARELA:
      fonte: cor_ou_raca
      expressao: [V01319]
