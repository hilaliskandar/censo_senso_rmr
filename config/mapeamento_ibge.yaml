# Mapeamento operacional entre variaveis publicadas pelo IBGE e campos canonicos do pipeline.
# Autoridade final: dicionarios oficiais listados em config/fontes.yaml.
# Neste ambiente, o XLSX oficial nao pode ser materializado; por isso codigos finos
# conferidos por produtos historicos + transcricao publica permanecem com validacao
# documental binaria pendente. O pipeline pode testa-los, mas nao promove-los sozinho.

status_padrao_codigo_fino: "operacional_conferido; validar_no_xlsx_oficial_antes_da_promocao"

