      fonte: alfabetizacao
      expressao: [V00852, V00853, V00854, V00855, V00856, V00857]
      descricao: "Pessoas de 15 anos ou mais, sabendo ou nao sabendo ler e escrever"
      status: confirmado
    NAO_ALF_15_MAIS:
      fonte: alfabetizacao
      expressao: [V00853, V00855, V00857]
      descricao: "Pessoas de 15 anos ou mais que nao sabem ler e escrever"
