estabilidade:
  referencia: "k-means k=4 da Fase 7"
  cenarios:
    - transformacao_percentil
    - ward
    - leave_one_variable_out
    - leave_one_domain_out
    - bootstrap
  bootstrap:
    repeticoes: 30
    fracao_amostra: 0.80
    reposicao: false
    ajustar_scaler_na_amostra: true
    prever_universo_completo: true
  alinhamento_rotulos: hungaro
  robusta_min: 0.80
  intermediaria_min: 0.60
  fronteira_percentual: 0.20
  classificacao_robustez: persistencia_estrutural
  observacao: "Persistência bootstrap mede sensibilidade amostral e não substitui persistência estrutural."
