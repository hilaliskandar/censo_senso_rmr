politica:
  - "A descrição da variável deve ser validada contra o dicionário oficial do IBGE antes da execução."
  - "Mudança de esquema ou ausência de variável obrigatória deve interromper a etapa dependente."
  - "Arquivos baixados devem ser registrados com URL, data de aquisição, tamanho e checksum no manifesto da execução."
  - "URL não verificada não deve ser inferida por padrão de nome; a aquisição deve falhar de forma explícita até sua confirmação."
  - "Fontes temáticas diferentes possuem universos distintos e não devem ser fundidas como se tivessem o mesmo denominador."
  - "Quando o FTP mantiver versões antigas e versões datadas no mesmo diretório, a versão escolhida deve ser explicitada no manifesto e não substituída silenciosamente."
  - "AREA_DOM não foi identificada como variável bruta nesta auditoria do FTP; deve permanecer tratada como produto derivado até que sua fonte/procedimento de construção seja documentado e reproduzido."
