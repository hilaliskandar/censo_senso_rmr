      V06002: "Moradores em domicílios particulares permanentes ocupados"
      V06004: "Valor do rendimento nominal médio mensal das pessoas responsáveis com rendimento"
      V06005: "Variância do rendimento nominal mensal das pessoas responsáveis com rendimento"
      V06006: "Valor do rendimento nominal mediano mensal das pessoas responsáveis com rendimento"
    cautela: "V06004/V06006 não são renda domiciliar per capita, renda familiar ou linha de pobreza."

politica:
  - "A descrição da variável deve ser validada contra o dicionário oficial do IBGE antes da execução."
  - "Mudança de esquema ou ausência de variável obrigatória deve interromper a etapa dependente."
  - "Arquivos baixados devem ser registrados com URL, data de aquisição e checksum no manifesto da execução."
  - "URL não verificada não deve ser inferida por padrão de nome; a aquisição deve falhar de forma explícita até sua confirmação."
  - "Fontes temáticas diferentes possuem universos distintos e não devem ser fundidas como se tivessem o mesmo denominador."
