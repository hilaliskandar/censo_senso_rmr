    - "Fossa séptica não ligada à rede não é automaticamente inadequada."
    - "V00316 e V00238 possuem sobreposição parcial e não devem ser somados mecanicamente."
    - "Valores X do IBGE permanecem ausentes, nunca zero."

entorno:
